name: CI/CD Go Documentation

on:
  # Trigger para Pull Requests na main
  pull_request:
    branches: [ main ]

  # Trigger para Pushes na main após merge
  push:
    branches: [ main ]

  # Agendamento semanal
  schedule:
    - cron: '0 0 * * 0'

jobs:
  # Job de Validação e Build 
  build_site:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Implementação de Cache
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Build Site
        run: zensical build

      # Upload de Artefato para o próximo job
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Job de Deploy
  deploy_site:
    name: Deploy para GitHub Pages
    runs-on: ubuntu-latest
    # O deploy aguarda a conclusão bem-sucedida do job de build
    needs: build_site
    # Condicional de segurança: impede deploy em Pull Requests
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
