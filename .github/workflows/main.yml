name: CI/CD Go Documentation

on:
  # Trigger para Pull Requests na main
  pull_request:
    branches: [ main ]

  # Trigger para Pushes na main após merge
  push:
    branches: [ main ]

  # Agendamento semanal
  schedule:
    - cron: '0 0 * * 0'

jobs:
  # Job de Validação e Build 
  build_site:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Implementação de Cache
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Build Site
        run: zensical build

      # Upload de Artefato para o próximo job
      - name: Upload artifact
        if: matrix.python-version == '3.11' # Apenas uma versão gera o artefato final
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  # Job de Deploy
  deploy_site:
    runs-on: ubuntu-latest
    needs: build_site # Aguarda o build 
    # Condicional: Não roda em PR, apenas push na main ou schedule
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4 # Download e publicação do artefato
